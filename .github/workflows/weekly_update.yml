name: Weekly UFC Judging Ingestion & Dashboard Update

on:
  schedule:
    # Runs every Monday at 10:00 UTC (captures weekend UFC events)
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "weekly-update"
  cancel-in-progress: false

jobs:
  update-data:
    name: Ingest Weekend UFC Events & Recompile Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly update pipeline
        run: |
          python src/weekly_update.py

      - name: Commit and push updates if new scorecards were ingested
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/ index.html
          if git diff --staged --quiet; then
            echo "✓ Database and dashboard are already up to date. No new event scorecards found."
          else
            git commit -m "Auto-update: Ingest latest UFC event scorecards and recompile dashboard [skip ci]"
            git push origin main
            echo "✓ Pushed updated judging datasets and recompiled dashboard to main."
          fi
