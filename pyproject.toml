[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "inspect_*.py",
    "find_all_ufc_events.py",
    "test_scrape.py",
    "test_urls.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "BLE", "C4", "PIE", "RUF", "SIM"]
ignore = ["E501", "E402", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
exclude = [
    "inspect_.*\\.py",
    "find_all_ufc_events\\.py",
    "test_scrape\\.py",
    "test_urls\\.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
